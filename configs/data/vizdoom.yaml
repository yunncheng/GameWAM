common:
  _target_: gamewam.datasets.game_video_dataset.GameVideoDataset
  dataset_dirs:
    - /path/to/datasets/VizDoom_Lerobot/battle1
    - /path/to/datasets/VizDoom_Lerobot/battle2
    - /path/to/datasets/VizDoom_Lerobot/defend_the_center
    - /path/to/datasets/VizDoom_Lerobot/defend_the_line
  state_schema: vizdoom

  shape_meta:
    images:
      - key: default
        raw_shape: [3, 480, 640]
        shape: [3, 224, 224]
    action:
      - key: default
        # shoot, move_forward, move_backward, strafe_left, strafe_right,
        # speed, turn_left, turn_right, turn_delta
        raw_shape: 9
        shape: 9
    state:
      - key: default
        # POSITION_X, POSITION_Y, ANGLE, HEALTH
        raw_shape: 4
        shape: 4

  # At 35 Hz this reads a dense 33-tick window (25 model ticks + 8-tick plan
  # lookahead), while the VAE observes every second tick.
  num_frames: 25
  num_obs_frames: 1
  frame_stride: 1
  action_video_freq_ratio: 2
  prediction_horizon: 16
  execution_horizon: 8
  val_set_proportion: 0.001
  skip_padding_as_possible: false
  concat_multi_camera: null

  # Uniform windows: the ViZDoom dataset does not provide the event-anchor
  # metadata required by event resampling.
  sample_interval: 8
  event_anchor_enabled: false
  event_anchor_radius: null
  sample_interval_event: null
  sample_interval_normal: null
  fine_task_resample_enabled: false
  fine_task_resample_mix_original: null
  fine_task_resample_gamma: null
  fine_task_resample_max_expected_repeat: null

  processor:
    _target_: gamewam.datasets.processors.gamewam_processor.GameWAMProcessor
    shape_meta: ${..shape_meta}
    num_frames: ${..num_frames}
    num_output_cameras: 1
    action_output_dim: 9
    proprio_output_dim: 4
    proprio_encoder_type: generic_linear
    drop_high_level_prob: 1.0
    dim_is_continuous: [false, false, false, false, false, false, false, false, true]
    gui_label_dim_index: null
    route_aware_action_normalization: false
    pad_action_dim_zero_mask:
      default: [true, true, true, true, true, true, true, true, true]
    action_state_transforms: []
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: gamewam.datasets.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: gamewam.datasets.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: ["${data.common.shape_meta.images.0.shape.1}", "${data.common.shape_meta.images.0.shape.2}"]
    val_transforms:
      - _target_: gamewam.datasets.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: ["${data.common.shape_meta.images.0.shape.1}", "${data.common.shape_meta.images.0.shape.2}"]

  text_embedding_cache_dir: /path/to/cache/text_embeds_cache/vizdoom_appo_ar
  prompt_template: "Control the Doom player to complete the task: {task}"
  vae_latent_cache_dir: /path/to/cache/vae_latent_cache/vizdoom_appo_ar
  vae_latent_cache_dtype: ${mixed_precision}
  context_len: 128

  history:
    predictive_loss_weight: 0.5
    recent_num_segments: 2
    history_conv_kernel_size: [1, 7, 7]
    history_conv_stride: [1, 7, 7]
    memory_num_levels: 2
    memory_tokens_per_level: 4
    memory_half_life_segments: [2, 4]
    history_horizon_dropout: 0.1

train:
  is_training_set: true

val:
  is_training_set: false
