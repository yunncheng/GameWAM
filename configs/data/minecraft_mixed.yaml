defaults:
  - _self_
  - /data_child_override@child.fine_event.override: mc_vpt_event
  - /data_child_override@child.contractor_history.override: mc_vpt_contractor
  - /data_child_override@child.scripted_gui.override: mc_scripted_gui

child:
  replacement: false
  fine_event:
    weight: 0.80
  contractor_history:
    weight: 0.05
  scripted_gui:
    weight: 0.15

common:
  _target_: gamewam.datasets.mixed_game_video_dataset.MixedGameVideoDataset
  _recursive_: false
  dataset_dirs: null

  shape_meta:
    images:
      - key: default
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 22
        shape: 22
    state:
      - key: default
        raw_shape: 6
        shape: 15

  # At 20 Hz this reads a dense 33-tick window (25 model ticks + 8-tick plan
  # lookahead), while the VAE observes every second tick.
  num_frames: 25
  num_obs_frames: 1
  frame_stride: 1
  action_video_freq_ratio: 2
  prediction_horizon: 16
  execution_horizon: 8
  val_set_proportion: 0.001
  skip_padding_as_possible: false
  concat_multi_camera: null

  sample_interval: null
  event_anchor_enabled: null
  event_anchor_radius: null
  sample_interval_event: null
  sample_interval_normal: null
  fine_task_resample_enabled: null
  fine_task_resample_mix_original: null
  fine_task_resample_gamma: null
  fine_task_resample_max_expected_repeat: null

  route_aware_action_normalization: true

  processor:
    _target_: gamewam.datasets.processors.gamewam_processor.GameWAMProcessor
    shape_meta: ${..shape_meta}
    num_frames: ${..num_frames}
    num_output_cameras: 1
    action_output_dim: 22
    proprio_output_dim: 15
    proprio_encoder_type: generic_masked_linear
    drop_high_level_prob: 1.0
    dim_is_continuous: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
    gui_label_dim_index: 5
    cursor_reference_size: [640, 360]
    route_aware_action_normalization: ${..route_aware_action_normalization}
    pad_action_dim_zero_mask:
      default: [true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true]
    action_state_transforms:
      - _target_: gamewam.datasets.transforms.asinh_transform.AsinhTransform
        key: default
        dims: [0]
        scale: 1.0
      - _target_: gamewam.datasets.transforms.asinh_transform.AsinhTransform
        key: default
        dims: [1]
        scale: 0.8
      - _target_: gamewam.datasets.transforms.minecraft_proprio.MinecraftCursorProprioTransform
        key: default
        cursor_reference_size: ${data.common.processor.cursor_reference_size}
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode:
      state:
        default: identity
      action:
        default:
          - dims: [0, 1]
            mode: z-score
    action_state_merger:
      _target_: gamewam.datasets.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: gamewam.datasets.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: ["${data.common.shape_meta.images.0.shape.1}", "${data.common.shape_meta.images.0.shape.2}"]
    val_transforms:
      - _target_: gamewam.datasets.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: ["${data.common.shape_meta.images.0.shape.1}", "${data.common.shape_meta.images.0.shape.2}"]

  text_embedding_cache_dir: null
  prompt_template: "Control the Minecraft player to complete the task: {task}"
  vae_latent_cache_dir: null
  vae_latent_cache_dtype: bf16
  context_len: 128

  history:
    predictive_loss_weight: 0.5
    recent_num_segments: 2
    history_conv_kernel_size: [1, 7, 7]
    history_conv_stride: [1, 7, 7]
    memory_num_levels: 2
    memory_tokens_per_level: 4
    memory_half_life_segments: [2, 4]
    history_horizon_dropout: 0.1

train:
  split: train
  pretrained_norm_stats: null

val:
  split: val
