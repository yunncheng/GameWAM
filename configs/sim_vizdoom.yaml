# @package _global_

defaults:
  - train
  - override /task: vizdoom_uncond_ar_224_2e-4.yaml
  - _self_

ckpt: null

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true

inference:
  mode: rollout
  device: cuda
  checkpoint_path: ${ckpt}
  dataset_stats_path: null
  prompt_template: "Control the Doom player to complete the task: {task}"
  num_inference_steps: 10
  eval_predict_video: false
  sigma_shift: null
  text_cfg_scale: 1.0
  rand_device: cpu
  tiled: false
  seed: 0
  image_size: [224, 224]

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
