# @package _global_

defaults:
  - override /data: minecraft_mixed
  - override /model: wan_uncond_ar
  - _self_

# dataloading
batch_size: 44
num_workers: 24

model:
  mot_checkpoint_mixed_attn: true

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 4e-5
num_epochs: 2
max_steps: null
log_every: 10
save_every: 1000
eval_every: 1000

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null