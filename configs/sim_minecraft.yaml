# @package _global_

defaults:
  - train
  - override /task: mc_uncond_ar_224_4e-5.yaml
  - _self_

# CLI --ckpt overrides this.
ckpt: null

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true

inference:
  mode: rollout                # offline | rollout

  # device / external paths
  device: cuda
  checkpoint_path: ${ckpt}
  dataset_stats_path: null
  prompt_template: "Control the Minecraft player to complete the task: {task}"

  # sampling
  num_inference_steps: 10
  eval_predict_video: false
  sigma_shift: null
  text_cfg_scale: 1.0
  rand_device: cpu
  tiled: false
  seed: 0

  # model image input
  image_size: [224, 224]

  # offline single-image → video demo (only used when mode=offline)
  input_image_path: null
  output_mp4: null
  num_frames: 33
  width: 224
  height: 224
  prompt: null

  # Action space decoding (consumed by env-side vector_to_action)
  binarize: true
  hotbar_argmax: true

  # MC environment
  render_size: [640, 360]
  fps: 20

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
