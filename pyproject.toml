[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamewam"
version = "0.1.0"
description = "GameWAM: A World Action Model for Video Games"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.18.0",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==1.12.0",
  "hydra-core==1.3.2",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1+cu128",
  "torchcodec==0.5",
  "torchvision==0.22.1+cu128",
  "tqdm==4.66.5",
  "transformers==5.2.0",
  "typing-extensions==4.15.0",
  "vizdoom==1.2.4",
  "wandb==0.23.1",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "matplotlib"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gamewam*"]

[tool.setuptools.package-data]
"gamewam.envs.minecraft.assets" = ["*.json", "*.png", "spawns/*.json"]
"gamewam.envs.vizdoom.assets" = ["scenarios/*.cfg", "scenarios/*.wad"]
"gamewam.envs.voxelibre" = ["assets/craftium_env/*.lua", "assets/craftium_env/*.conf"]
